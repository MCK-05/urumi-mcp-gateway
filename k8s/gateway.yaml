apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-api-key-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-mcp-gateway
  labels:
    app: urumi-mcp-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urumi-mcp-gateway
  template:
    metadata:
      labels:
        app: urumi-mcp-gateway
    spec:
      containers:
        - name: gateway
          image: urumi-mcp-gateway:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: API_KEY_DB_PATH
              value: "/data/api-keys.sqlite"
            - name: AUDIT_LOG_DB_PATH
              value: "/data/audit-logs.sqlite"
            - name: CATALOG_MCP_URL
              value: "http://catalog-upstream:3101/mcp"
            - name: INVENTORY_MCP_URL
              value: "http://inventory-upstream:3102/mcp"
            - name: WOOCOMMERCE_MCP_URL
              value: "http://woocommerce-upstream:3103/mcp"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: dashboard-admin-secret
                  key: admin-email
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboard-admin-secret
                  key: admin-password
                  optional: true
            - name: UPSTREAM_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-encryption-secret
                  key: encryption-key
                  optional: true
            - name: LLM_BASE_URL
              value: "https://api.openai.com/v1"
            - name: LLM_MODEL
              value: "gpt-4o-mini"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-secret
                  key: api-key
                  optional: true
          volumeMounts:
            - name: api-key-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: api-key-data
          persistentVolumeClaim:
            claimName: gateway-api-key-data
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-mcp-gateway
spec:
  type: ClusterIP
  selector:
    app: urumi-mcp-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
